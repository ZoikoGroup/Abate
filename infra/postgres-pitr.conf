# infra/postgres-pitr.conf
# PostgreSQL 16 Point-in-Time Recovery (PITR) & WAL Archiving Configuration
# Supports Completion Plan Section 5.8 & G-10 (RPO <= 15 minutes, RTO <= 4 hours).

listen_addresses = '*'
wal_level = replica
archive_mode = on
archive_timeout = 300
archive_command = 'test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f'
max_wal_senders = 4
wal_keep_size = 512MB
checkpoint_timeout = 10min
log_checkpoints = on
log_connections = off
log_disconnections = off
log_statement = 'ddl'
