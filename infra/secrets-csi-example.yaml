# infra/secrets-csi-example.yaml
# Completion Plan G-09 / Section 9: External Secrets / KMS CSI mount example for ABATE_SECRETS_DIR.
# Secrets are materialized into an in-memory tmpfs mount at runtime (never baked into images or git).
# Compatible with Kubernetes Secrets Store CSI Driver (AWS Secrets Manager / GCP Secret Manager / Vault).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: abate-runtime-secrets
  namespace: abate-staging
spec:
  provider: aws # or gcp / vault
  parameters:
    objects: |
      - objectName: "abate/staging/runtime-keys"
        objectType: "secretsmanager"
        jmesPath:
          - path: "DATABASE_URL_APP"
            objectAlias: "DATABASE_URL_APP"
          - path: "DATABASE_URL_WORKER"
            objectAlias: "DATABASE_URL_WORKER"
          - path: "DATABASE_URL_IDENTITY"
            objectAlias: "DATABASE_URL_IDENTITY"
          - path: "DATABASE_URL_PROTECTED_COMPUTE"
            objectAlias: "DATABASE_URL_PROTECTED_COMPUTE"
          - path: "DATABASE_URL_RELEASE_COMPILER"
            objectAlias: "DATABASE_URL_RELEASE_COMPILER"
          - path: "DATABASE_URL_PERFORMANCE"
            objectAlias: "DATABASE_URL_PERFORMANCE"
          - path: "DATABASE_URL_OPS"
            objectAlias: "DATABASE_URL_OPS"
          - path: "AUTH_SECRET"
            objectAlias: "AUTH_SECRET"
          - path: "PSEUDONYM_SECRET"
            objectAlias: "PSEUDONYM_SECRET"
          - path: "ACTION_GRANT_SECRET"
            objectAlias: "ACTION_GRANT_SECRET"
          - path: "SUPPORT_AUTH_SECRET"
            objectAlias: "SUPPORT_AUTH_SECRET"
          - path: "CONNECTOR_WEBHOOK_SECRET"
            objectAlias: "CONNECTOR_WEBHOOK_SECRET"
          - path: "OBJECT_STORE_ACCESS_KEY"
            objectAlias: "OBJECT_STORE_ACCESS_KEY"
          - path: "OBJECT_STORE_SECRET_KEY"
            objectAlias: "OBJECT_STORE_SECRET_KEY"
---
# Mount inside backend / worker Deployment:
#   env:
