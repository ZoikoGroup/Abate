# docker-compose.yml for Abate Local Services
# Pinned versions per Phase 0 foundation specification

services:
  postgres:
    image: postgres:16.2-alpine
    container_name: abate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: abate
      POSTGRES_PASSWORD: dev_only_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  objectstore:
    image: minio/minio:RELEASE.2024-03-05T04-48-44Z
    container_name: abate-objectstore
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:

