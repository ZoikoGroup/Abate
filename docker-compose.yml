# docker-compose.yml for Abate Local Services
# Pinned versions per Phase 0 foundation specification

services:
  postgres:
    image: postgres:16.2-alpine
    container_name: abate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: abate
      POSTGRES_PASSWORD: dev_only_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro

  objectstore:
    image: minio/minio:RELEASE.2024-03-05T04-48-44Z
    container_name: abate-objectstore
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  migrator:
    profiles: ["fullstack"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abate-migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: staging
      ABATE_REQUIRE_PG: "1"
      DATABASE_URL_MIGRATOR: postgres://abate_migrator:migrator_pw@postgres:5432/abate
      DATABASE_URL_APP: postgres://abate_app:app_pw@postgres:5432/abate
      DATABASE_URL_WORKER: postgres://abate_worker:worker_pw@postgres:5432/abate
    command: ["npm", "run", "migrate"]
    restart: "no"

  backend:
    profiles: ["fullstack"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abate-backend
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      APP_ENV: test
      PORT: "5000"
      CLIENT_URL: http://localhost:5173
      ABATE_REQUIRE_PG: "1"
      DATABASE_URL_MIGRATOR: postgres://abate_migrator:migrator_pw@postgres:5432/abate
      DATABASE_URL_APP: postgres://abate_app:app_pw@postgres:5432/abate
      DATABASE_URL_WORKER: postgres://abate_worker:worker_pw@postgres:5432/abate
      OBJECT_STORE_ENDPOINT: http://objectstore:9000
      OBJECT_STORE_ACCESS_KEY: minioadmin
      OBJECT_STORE_SECRET_KEY: minioadmin_dev_only
      AUTH_ISSUER: http://localhost:5000/auth
      AUTH_AUDIENCE: abate-api
      AUTH_SECRET: compose_dev_auth_secret_key_abate_minimum_32_characters_long
      SUPPORT_AUTH_SECRET: compose_dev_support_secret_abate_minimum_32_characters_long
      ACTION_GRANT_SECRET: compose_dev_action_grant_secret_abate_minimum_32_chars
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    profiles: ["fullstack"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abate-worker
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      APP_ENV: test
      ABATE_REQUIRE_PG: "1"
      DATABASE_URL_WORKER: postgres://abate_worker:worker_pw@postgres:5432/abate
      ACTION_GRANT_SECRET: compose_dev_action_grant_secret_abate_minimum_32_chars
    command: ["npm", "run", "worker"]
    restart: unless-stopped

  frontend:
    profiles: ["fullstack"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: abate-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:8080"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
