name: Abate Constitutional & Parity CI

on:
  push:
    branches: ["main", "Aditya"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: PostgreSQL Parity, Constitutional Gates & Frontend Build
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16.2-alpine
        env:
          POSTGRES_USER: abate_admin
          POSTGRES_PASSWORD: admin_pw
          POSTGRES_DB: abate
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U abate_admin -d abate"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT || '5432' }}
      AUTH_ISSUER: http://localhost:5000/auth
      AUTH_AUDIENCE: abate-api
      AUTH_SECRET: ci_test_auth_secret_key_abate_minimum_32_characters_long
      SUPPORT_AUTH_SECRET: ci_test_support_secret_key_abate_minimum_32_characters_long
      ACTION_GRANT_SECRET: ci_test_action_grant_secret_key_abate_min_32_chars_long
      FIXED_CLOCK: 2026-03-02T09:00:00Z

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend and frontend dependencies
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Initialize database roles from 01-roles.sql and verify non-superuser isolation
        env:
          PORT: ${{ env.POSTGRES_PORT }}
        run: |
          PGPASSWORD=admin_pw psql -h localhost -p "${PORT}" -U abate_admin -d abate -v ON_ERROR_STOP=1 -f backend/db/init/01-roles.sql
          
          # Assert that every expected role exists, can login, and has strictly NO superuser, NO bypassrls, and NO createdb
          PGPASSWORD=admin_pw psql -h localhost -p "${PORT}" -U abate_admin -d abate -v ON_ERROR_STOP=1 -c "
            DO \$\$
            DECLARE
              expected_roles text[] := ARRAY[
                'abate_migrator',
                'abate_app',
                'abate_worker',
                'abate_identity',
                'abate_privacy',
                'abate_protected_compute',
                'abate_release_compiler',
                'abate_performance',
                'abate_ops',
                'abate_platform_admin'
              ];
              r_name text;
              r record;
            BEGIN
              FOREACH r_name IN ARRAY expected_roles LOOP
                SELECT rolname, rolsuper, rolbypassrls, rolcanlogin, rolcreatedb, rolcreaterole
                INTO r
                FROM pg_roles
                WHERE rolname = r_name;

                IF NOT FOUND THEN
                  RAISE EXCEPTION 'CRITICAL: Expected database role % does not exist in pg_roles', r_name;
                END IF;

                IF r.rolsuper THEN
                  RAISE EXCEPTION 'SECURITY BREACH: Role % is configured as SUPERUSER in CI', r_name;
                END IF;

                IF r.rolbypassrls THEN
                  RAISE EXCEPTION 'SECURITY BREACH: Role % has BYPASSRLS privilege in CI', r_name;
                END IF;

                IF NOT r.rolcanlogin THEN
                  RAISE EXCEPTION 'CONFIGURATION ERROR: Role % is not permitted to login', r_name;
                END IF;

                IF r.rolcreatedb THEN
                  RAISE EXCEPTION 'LEAST-PRIVILEGE BREACH: Role % has CREATEDB privilege in CI', r_name;
                END IF;

                IF r.rolcreaterole THEN
                  RAISE EXCEPTION 'LEAST-PRIVILEGE BREACH: Role % has CREATEROLE privilege in CI', r_name;
                END IF;
              END LOOP;
            END \$\$;
          "

      - name: Run clean database migrations
        env:
          ABATE_REQUIRE_PG: "1"
          DATABASE_URL_MIGRATOR: postgres://abate_migrator:migrator_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_APP: postgres://abate_app:app_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_WORKER: postgres://abate_worker:worker_pw@localhost:${{ env.POSTGRES_PORT }}/abate
        run: npm --prefix backend run migrate

      - name: Verify live Postgres role isolation, DB catalog audit, and migration checksums
        env:
          ABATE_REQUIRE_PG: "1"
          DATABASE_URL_MIGRATOR: postgres://abate_migrator:migrator_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_APP: postgres://abate_app:app_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_WORKER: postgres://abate_worker:worker_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_IDENTITY: postgres://abate_identity:identity_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_PROTECTED_COMPUTE: postgres://abate_protected_compute:protected_compute_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_RELEASE_COMPILER: postgres://abate_release_compiler:release_compiler_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_PERFORMANCE: postgres://abate_performance:performance_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_OPS: postgres://abate_ops:ops_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_PLATFORM_ADMIN: postgres://abate_platform_admin:platform_admin_pw@localhost:${{ env.POSTGRES_PORT }}/abate
        run: |
          npm --prefix backend run verify-pg -- --require-live
          npm --prefix backend run db:audit -- --require-live
          npm --prefix backend run test-pg-parity -- --require-live

      - name: Verify idempotent migration re-run and schema snapshot (no drift)
        env:
          ABATE_REQUIRE_PG: "1"
          DATABASE_URL_MIGRATOR: postgres://abate_migrator:migrator_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_APP: postgres://abate_app:app_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_WORKER: postgres://abate_worker:worker_pw@localhost:${{ env.POSTGRES_PORT }}/abate
        run: |
          if ! command -v pg_dump >/dev/null 2>&1 || ! pg_dump --version | grep -q ' 16\.'; then
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends postgresql-client-16; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
          npm --prefix backend run migrate
          pg_dump --schema-only "postgres://abate_migrator:migrator_pw@localhost:${{ env.POSTGRES_PORT }}/abate" | grep -Ev '^\\(un)?restrict ' > /tmp/abate-schema-1.sql
          npm --prefix backend run migrate
          pg_dump --schema-only "postgres://abate_migrator:migrator_pw@localhost:${{ env.POSTGRES_PORT }}/abate" | grep -Ev '^\\(un)?restrict ' > /tmp/abate-schema-2.sql
          diff -u /tmp/abate-schema-1.sql /tmp/abate-schema-2.sql

      - name: Verify upgrade migration path from previous release (0001..0083 -> HEAD)
        env:
          ABATE_REQUIRE_PG: "1"
          DATABASE_URL_MIGRATOR: postgres://abate_migrator:migrator_pw@localhost:${{ env.POSTGRES_PORT }}/abate_upgrade
          DATABASE_URL_APP: postgres://abate_app:app_pw@localhost:${{ env.POSTGRES_PORT }}/abate_upgrade
          DATABASE_URL_WORKER: postgres://abate_worker:worker_pw@localhost:${{ env.POSTGRES_PORT }}/abate_upgrade
          DATABASE_URL_IDENTITY: postgres://abate_identity:identity_pw@localhost:${{ env.POSTGRES_PORT }}/abate_upgrade
          DATABASE_URL_PROTECTED_COMPUTE: postgres://abate_protected_compute:protected_compute_pw@localhost:${{ env.POSTGRES_PORT }}/abate_upgrade
          DATABASE_URL_RELEASE_COMPILER: postgres://abate_release_compiler:release_compiler_pw@localhost:${{ env.POSTGRES_PORT }}/abate_upgrade
          DATABASE_URL_PERFORMANCE: postgres://abate_performance:performance_pw@localhost:${{ env.POSTGRES_PORT }}/abate_upgrade
          DATABASE_URL_OPS: postgres://abate_ops:ops_pw@localhost:${{ env.POSTGRES_PORT }}/abate_upgrade
          DATABASE_URL_PLATFORM_ADMIN: postgres://abate_platform_admin:platform_admin_pw@localhost:${{ env.POSTGRES_PORT }}/abate_upgrade
        run: |
          PGPASSWORD=admin_pw psql -h localhost -p "${POSTGRES_PORT}" -U abate_admin -d postgres -c "DROP DATABASE IF EXISTS abate_upgrade;"
          PGPASSWORD=admin_pw psql -h localhost -p "${POSTGRES_PORT}" -U abate_admin -d postgres -c "CREATE DATABASE abate_upgrade OWNER abate_migrator;"
          PGPASSWORD=admin_pw psql -h localhost -p "${POSTGRES_PORT}" -U abate_admin -d abate_upgrade -f backend/db/init/01-roles.sql
          npm --prefix backend run migrate -- --up-to=0083
          npm --prefix backend run migrate
          npm --prefix backend run db:audit -- --require-live

      - name: Seed live Postgres fixtures, load benchmark, and restore drill
        env:
          CI: "true"
          ABATE_REQUIRE_PG: "1"
          POSTGRES_ADMIN_URL: postgres://abate_admin:admin_pw@localhost:${{ env.POSTGRES_PORT }}/postgres
          DATABASE_URL_MIGRATOR: postgres://abate_migrator:migrator_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_APP: postgres://abate_app:app_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_WORKER: postgres://abate_worker:worker_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_IDENTITY: postgres://abate_identity:identity_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_PROTECTED_COMPUTE: postgres://abate_protected_compute:protected_compute_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_RELEASE_COMPILER: postgres://abate_release_compiler:release_compiler_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_PERFORMANCE: postgres://abate_performance:performance_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_OPS: postgres://abate_ops:ops_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_PLATFORM_ADMIN: postgres://abate_platform_admin:platform_admin_pw@localhost:${{ env.POSTGRES_PORT }}/abate
        run: |
          npm --prefix backend run seed-demo -- --pg
          npm --prefix backend run verify-pg-smoke
          npm --prefix backend run test-explain -- --require-live
          npm --prefix backend run test-load -- --http --tcp
          npm --prefix backend run measure-restore
          npm --prefix backend run rehearse:pitr -- --require-live

      - name: Run Live PostgreSQL Constitutional, Sector, Challenge, Drill & 30-Day HTTP Suites (G-01 / T-02)
        env:
          ABATE_REQUIRE_PG: "1"
          DATABASE_URL_MIGRATOR: postgres://abate_migrator:migrator_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_APP: postgres://abate_app:app_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_WORKER: postgres://abate_worker:worker_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_IDENTITY: postgres://abate_identity:identity_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_PROTECTED_COMPUTE: postgres://abate_protected_compute:protected_compute_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_RELEASE_COMPILER: postgres://abate_release_compiler:release_compiler_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_PERFORMANCE: postgres://abate_performance:performance_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_OPS: postgres://abate_ops:ops_pw@localhost:${{ env.POSTGRES_PORT }}/abate
          DATABASE_URL_PLATFORM_ADMIN: postgres://abate_platform_admin:platform_admin_pw@localhost:${{ env.POSTGRES_PORT }}/abate
        run: |
          reset_pg_db() {
            PGPASSWORD=admin_pw psql -h localhost -p "${POSTGRES_PORT}" -U abate_admin -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'abate' AND pid <> pg_backend_pid();" >/dev/null
            PGPASSWORD=admin_pw psql -h localhost -p "${POSTGRES_PORT}" -U abate_admin -d postgres -c "DROP DATABASE IF EXISTS abate;" >/dev/null
            PGPASSWORD=admin_pw psql -h localhost -p "${POSTGRES_PORT}" -U abate_admin -d postgres -c "CREATE DATABASE abate OWNER abate_migrator;" >/dev/null
            PGPASSWORD=admin_pw psql -h localhost -p "${POSTGRES_PORT}" -U abate_admin -d abate -v ON_ERROR_STOP=1 -f backend/db/init/01-roles.sql >/dev/null
            npm --prefix backend run migrate >/dev/null
          }
          reset_pg_db
          npm --prefix backend run test-retention
          npm --prefix backend run test-ingest
          npm --prefix backend run test-privacy
          npm --prefix backend run test-control
          npm --prefix backend run test-ai
          npm --prefix backend run test-planes
          npm --prefix backend run test-completion
          npm --prefix backend run test-super-admin
          npm --prefix backend run test-admin-matrix
          reset_pg_db
          npm --prefix backend run test-boundaries
          reset_pg_db
          npm --prefix backend run seed-demo -- --pg
          npm --prefix backend run test-additive
          npm --prefix backend run test-legal
          npm --prefix backend run test-sector-registry
          npm --prefix backend run test-sector-work
          npm --prefix backend run test-sector-rules
          npm --prefix backend run test-hold-reference
          npm --prefix backend run test-ai-evals
          npm --prefix backend run test-worker
          npm --prefix backend run drill-kill-switches
          npm --prefix backend run drill:incident
          npm --prefix backend run rehearse:key-rotation
          npm --prefix backend run challenge
          npm --prefix backend run check:endpoints
          npm --prefix backend run sim-30d -- --tcp

      - name: Run wording lint, OpenAPI contract check, typecheck and compile backend
        run: |
          npm --prefix backend run lint:wording
          npm --prefix backend run lint:sector-neutrality
          npm --prefix backend run generate:openapi -- --check
          npm --prefix backend run build

      - name: Run Phase 1-9 and Worker constitutional suites
        env:
          ABATE_REQUIRE_PG: "0"
          DATABASE_URL_MIGRATOR: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_APP: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_WORKER: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_IDENTITY: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_PROTECTED_COMPUTE: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_RELEASE_COMPILER: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_PERFORMANCE: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_OPS: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_PLATFORM_ADMIN: postgres://disabled:disabled@127.0.0.1:1/abate
        run: |
          npm --prefix backend run test-fast
          npm --prefix backend run test-completion
          npm --prefix backend run test-super-admin
          npm --prefix backend run test-admin-matrix
          npm --prefix backend run test-additive
          npm --prefix backend run test-pilot
          npm --prefix backend run test-legal
          npm --prefix backend run test-sector-registry
          npm --prefix backend run test-sector-work
          npm --prefix backend run test-sector-rules
          npm --prefix backend run test-hold-reference
          npm --prefix backend run test-boundaries
          npm --prefix backend run test-ingest
          npm --prefix backend run test-privacy
          npm --prefix backend run test-control
          npm --prefix backend run test-retention
          npm --prefix backend run test-ai
          npm --prefix backend run test-ai-evals
          npm --prefix backend run test-planes
          npm --prefix backend run test-worker

      - name: Run Evidence Verifier, Kill Switch Drill, 30-Day HTTP Sim and Endpoint Check
        env:
          ABATE_REQUIRE_PG: "0"
          DATABASE_URL_MIGRATOR: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_APP: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_WORKER: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_IDENTITY: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_PROTECTED_COMPUTE: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_RELEASE_COMPILER: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_PERFORMANCE: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_OPS: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_PLATFORM_ADMIN: postgres://disabled:disabled@127.0.0.1:1/abate
        run: |
          npm --prefix backend run verify-evidence
          npm --prefix backend run drill-kill-switches
          npm --prefix backend run drill:incident
          npm --prefix backend run rehearse:key-rotation
          npm --prefix backend run challenge
          npm --prefix backend run sim-30d -- --tcp
          npm --prefix backend run check:endpoints

      - name: Lint, unit-test and build frontend
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend test
          npm --prefix frontend run build

      - name: Generate SBOM and run dependency security audit
        run: |
          npm --prefix backend run generate:sbom
          npm --prefix backend audit --omit=dev --audit-level=high
          npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Validate Docker Compose configs, build container images and record digests
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f infra/docker-compose.staging.yml config -q
          docker build -t abate-backend:ci ./backend
          docker build -t abate-frontend:ci ./frontend
          BACKEND_ID=$(docker image inspect --format='{{.Id}}' abate-backend:ci)
          FRONTEND_ID=$(docker image inspect --format='{{.Id}}' abate-frontend:ci)
          echo "ABATE_IMAGE_DIGESTS={\"backend\":\"${BACKEND_ID}\",\"frontend\":\"${FRONTEND_ID}\"}" >> "$GITHUB_ENV"

      - name: Scan backend and frontend container images with Trivy (G-28 / T-25)
        run: |
          mkdir -p evidence
          TRIVY_IMAGE="ghcr.io/aquasecurity/trivy:0.58.2"
          docker pull "$TRIVY_IMAGE" || { TRIVY_IMAGE="aquasec/trivy:0.58.2"; docker pull "$TRIVY_IMAGE"; }
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/evidence:/evidence" \
            "$TRIVY_IMAGE" image \
            --format table \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --output /evidence/trivy-backend.txt \
            abate-backend:ci
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/evidence:/evidence" \
            "$TRIVY_IMAGE" image \
            --format table \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --output /evidence/trivy-frontend.txt \
            abate-frontend:ci

      - name: Assemble dynamic Release Dossier and verify READY FOR REVIEW or RATIFIED state
        env:
          ABATE_REQUIRE_PG: "0"
          DATABASE_URL_MIGRATOR: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_APP: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_WORKER: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_IDENTITY: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_PROTECTED_COMPUTE: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_RELEASE_COMPILER: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_PERFORMANCE: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_OPS: postgres://disabled:disabled@127.0.0.1:1/abate
          DATABASE_URL_PLATFORM_ADMIN: postgres://disabled:disabled@127.0.0.1:1/abate
        run: |
          npm --prefix backend run build-dossier
          node -e "const d = require('./evidence/release-dossier.json'); if (d.status !== 'READY FOR REVIEW' && d.status !== 'RATIFIED') { console.error('Expected READY FOR REVIEW or RATIFIED, got', d.status); process.exit(1); } if (!d.system?.imageDigests?.backend || !d.system?.sbom?.sha256) { console.error('Dossier must bind imageDigests and SBOM sha256'); process.exit(1); }"

      - name: Upload Release Dossier artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-dossier
          path: |
            evidence/release-dossier.json
            evidence/sbom.json
            evidence/independent-challenge-report.json
            evidence/challenge-findings.md
            evidence/sim-30d-report.json
            evidence/kill-switch-drill-report.json
            evidence/incident-exercise-report.json
            evidence/key-rotation-rehearsal-report.json
            evidence/pitr-rehearsal-report.json
            evidence/restore-rehearsal-report.json
            evidence/pg-restore-measurement.json
            evidence/slo-benchmark-report.json
            evidence/trivy-backend.txt
            evidence/trivy-frontend.txt
            frontend/public/release-dossier.json

  e2e-a11y:
    name: Browser E2E & WCAG 2.1 AA Accessibility (Playwright + Axe on Live PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.2-alpine
        env:
          POSTGRES_USER: abate_admin
          POSTGRES_PASSWORD: admin_pw
          POSTGRES_DB: abate
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U abate_admin -d abate"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT || '5432' }}
      ABATE_REQUIRE_PG: "1"
      DATABASE_URL_MIGRATOR: postgres://abate_migrator:migrator_pw@localhost:${{ vars.POSTGRES_PORT || '5432' }}/abate
      DATABASE_URL_APP: postgres://abate_app:app_pw@localhost:${{ vars.POSTGRES_PORT || '5432' }}/abate
      DATABASE_URL_WORKER: postgres://abate_worker:worker_pw@localhost:${{ vars.POSTGRES_PORT || '5432' }}/abate
      DATABASE_URL_IDENTITY: postgres://abate_identity:identity_pw@localhost:${{ vars.POSTGRES_PORT || '5432' }}/abate
      DATABASE_URL_PROTECTED_COMPUTE: postgres://abate_protected_compute:protected_compute_pw@localhost:${{ vars.POSTGRES_PORT || '5432' }}/abate
      DATABASE_URL_RELEASE_COMPILER: postgres://abate_release_compiler:release_compiler_pw@localhost:${{ vars.POSTGRES_PORT || '5432' }}/abate
      DATABASE_URL_PERFORMANCE: postgres://abate_performance:performance_pw@localhost:${{ vars.POSTGRES_PORT || '5432' }}/abate
      DATABASE_URL_OPS: postgres://abate_ops:ops_pw@localhost:${{ vars.POSTGRES_PORT || '5432' }}/abate
      DATABASE_URL_PLATFORM_ADMIN: postgres://abate_platform_admin:platform_admin_pw@localhost:${{ vars.POSTGRES_PORT || '5432' }}/abate
      AUTH_ISSUER: http://localhost:5000/auth
      AUTH_AUDIENCE: abate-api
      AUTH_SECRET: ci_test_auth_secret_key_abate_minimum_32_characters_long
      SUPPORT_AUTH_SECRET: ci_test_support_secret_key_abate_minimum_32_characters_long
      ACTION_GRANT_SECRET: ci_test_action_grant_secret_key_abate_min_32_chars_long
      FIXED_CLOCK: 2026-03-02T09:00:00Z
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend, frontend, and test dependencies
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci
          npm --prefix tests ci

      - name: Initialize database roles from 01-roles.sql and verify non-superuser isolation
        env:
          PORT: ${{ env.POSTGRES_PORT }}
        run: |
          PGPASSWORD=admin_pw psql -h localhost -p "${PORT}" -U abate_admin -d abate -v ON_ERROR_STOP=1 -f backend/db/init/01-roles.sql
          PGPASSWORD=admin_pw psql -h localhost -p "${PORT}" -U abate_admin -d abate -v ON_ERROR_STOP=1 -c "
            DO \$\$
            DECLARE
              expected_roles text[] := ARRAY[
                'abate_migrator',
                'abate_app',
                'abate_worker',
                'abate_identity',
                'abate_privacy',
                'abate_protected_compute',
                'abate_release_compiler',
                'abate_performance',
                'abate_ops',
                'abate_platform_admin'
              ];
              r_name text;
              r record;
            BEGIN
              FOREACH r_name IN ARRAY expected_roles LOOP
                SELECT rolname, rolsuper, rolbypassrls, rolcanlogin, rolcreatedb, rolcreaterole
                INTO r
                FROM pg_roles
                WHERE rolname = r_name;
                IF NOT FOUND THEN
                  RAISE EXCEPTION 'CRITICAL: Expected database role % does not exist', r_name;
                END IF;
                IF r.rolsuper OR r.rolbypassrls OR r.rolcreatedb OR r.rolcreaterole OR NOT r.rolcanlogin THEN
                  RAISE EXCEPTION 'SECURITY BREACH: Role % has invalid attributes (super=%, bypassrls=%, createdb=%, createrole=%, login=%)',
                    r_name, r.rolsuper, r.rolbypassrls, r.rolcreatedb, r.rolcreaterole, r.rolcanlogin;
                END IF;
              END LOOP;
            END \$\$;
          "

      - name: Migrate and seed live PostgreSQL for Playwright E2E
        run: |
          npm --prefix backend run migrate
          npm --prefix backend run seed-demo -- --pg

      - name: Typecheck Playwright test suite
        run: npm --prefix tests run typecheck

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          # GitHub's ubuntu-24.04 runner already ships all Chromium runtime shared libraries.
          # Avoid `playwright install --with-deps`, which unconditionally invokes apt-get for
          # optional international/X11 fonts and fails whenever Ubuntu EC2 mirrors return 503.
          REQUIRED_LIBS=(
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64
            libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64
            libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
            libfontconfig1 libfreetype6
          )
          MISSING_LIBS=()
          for pkg in "${REQUIRED_LIBS[@]}"; do
            if ! dpkg-query -W -f='${Status}\n' "$pkg" 2>/dev/null | grep -qx 'install ok installed'; then
              MISSING_LIBS+=("$pkg")
            fi
          done
          if [ "${#MISSING_LIBS[@]}" -gt 0 ]; then
            echo "Installing missing Chromium runtime libraries: ${MISSING_LIBS[*]}"
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends "${MISSING_LIBS[@]}"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep $((attempt * 5))
            done
          else
            echo "All Chromium runtime shared libraries are already installed; skipping apt-get."
          fi

          for attempt in 1 2 3; do
            if npm --prefix tests exec -- playwright install chromium; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Run Playwright E2E and Axe Accessibility Suites
        run: npm --prefix tests run test:e2e


